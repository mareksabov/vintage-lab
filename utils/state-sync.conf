# Configuration for state-sync.sh — edit these.

# Directory where the shared state lives. Must be an already-mounted Samba /
# network share (or any path) reachable on THIS machine.
SAMBA_DIR="/mnt/samba/vintage-lab"

# Which machines (folder names under machines/) to sync, space-separated.
MACHINES="optiplex-gx"

# Which per-machine subdirectories to sync. "state" holds the installed disk
# image + NVRAM. Add "media" if you also want disk/CD images synced, e.g.
# SYNC_DIRS="state media"
SYNC_DIRS="state"
