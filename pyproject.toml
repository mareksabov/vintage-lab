[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vintage"
version = "0.1.0"
description = "Reproducible retro machine launcher"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vintage = "vintage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
