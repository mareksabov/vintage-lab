[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vintage"
version = "0.1.0"
description = "Reproducible retro machine launcher"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vintage = "vintage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
